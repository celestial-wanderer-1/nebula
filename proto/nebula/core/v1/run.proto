syntax = "proto3";

package nebula.core.v1;

import "google/protobuf/timestamp.proto";
import "nebula/core/v1/entity.proto";
import "nebula/core/v1/output.proto";
import "nebula/core/v1/project.proto";

// Typed failure reasons of A§3.7 and A§6.8.
enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_OOM = 1;
  FAILURE_REASON_NAN = 2;
  FAILURE_REASON_DIVERGED = 3;
  FAILURE_REASON_PLUGIN_ERROR = 4;
  FAILURE_REASON_GEOMETRY_FAILED = 5;
  FAILURE_REASON_CRASHED = 6;
  FAILURE_REASON_SUPERVISOR_LOST = 7;
}

// Provenance tags shown on Runs (A§13.3).
enum ProvenanceTag {
  PROVENANCE_TAG_UNSPECIFIED = 0;
  // Re-executed on a newer build (D62).
  PROVENANCE_TAG_REBUILT = 1;
  // Resumed across builds (D130).
  PROVENANCE_TAG_MIXED_BUILDS = 2;
  // Imported with a build that does not match this installation (D100, D149).
  PROVENANCE_TAG_NOT_REPRODUCIBLE_HERE = 3;
}

// Run states of A§14.1.
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_QUEUED = 1;
  // Meshing, partitioning and discretizing before the GPU wait (D121).
  RUN_STATE_PREPARING = 2;
  RUN_STATE_RUNNING = 3;
  RUN_STATE_PAUSED = 4;
  RUN_STATE_COMPLETED = 5;
  RUN_STATE_FAILED = 6;
  RUN_STATE_CANCELLED = 7;
  RUN_STATE_DISCARDED = 8;
}

// Determinism mode a Run is submitted with (D77); part of the cache key.
enum DeterminismMode {
  DETERMINISM_MODE_UNSPECIFIED = 0;
  // The default (D77).
  DETERMINISM_MODE_DETERMINISTIC = 1;
  DETERMINISM_MODE_FAST = 2;
}

// Determinism an attempt achieved: deterministic only if every step ran on
// deterministic paths (D129).
enum DeterminismClass {
  DETERMINISM_CLASS_UNSPECIFIED = 0;
  DETERMINISM_CLASS_DETERMINISTIC = 1;
  DETERMINISM_CLASS_NONDETERMINISTIC = 2;
}

// Reproducibility level of a Run, judged from its own attempts (A§15.2,
// D43, D149).
enum ReproducibilityClass {
  REPRODUCIBILITY_CLASS_UNSPECIFIED = 0;
  REPRODUCIBILITY_CLASS_BITWISE = 1;
  // Agrees within each output's declared tolerance.
  REPRODUCIBILITY_CLASS_TOLERANCE = 2;
}

// Hardware an attempt ran on (A§4.3, D149).
message Hardware {
  string vendor = 1;
  string gpu_model = 2;
  repeated string gpu_uuids = 3;
  uint32 gpu_count = 4;
  string topology = 5;
}

// One attempt of a Run's execution record; attempts are append-only (D130).
message Attempt {
  uint32 number = 1;
  // State the attempt is in or ended in.
  RunState state = 2;
  FailureReason failure = 3;
  string failure_detail = 4;
  // Rank that failed; unset when not attributable to one.
  optional uint32 failed_rank = 5;
  // Workflow node that failed.
  string failed_step = 6;
  // Whether a committed checkpoint epoch exists to resume from (D141).
  bool has_checkpoint = 7;
  uint32 checkpoint_epoch = 8;
  // Engine binary plus spack.lock hash (D126).
  string engine_build = 9;
  // ROCm/CUDA, vendor libraries, RCCL/NCCL, MPI and driver versions.
  map<string, string> runtime_versions = 10;
  Hardware hardware = 11;
  DeterminismClass achieved = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp ended_at = 14;
  // GPU indices of the attempt's homogeneous subset (D40).
  repeated uint32 gpu_indices = 15;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_PENDING = 1;
  // Outputs reused from the cache (D78).
  STEP_STATE_CACHED = 2;
  STEP_STATE_RUNNING = 3;
  STEP_STATE_COMPLETED = 4;
  STEP_STATE_FAILED = 5;
}

// Status of one workflow step of a Run.
message StepStatus {
  string node_id = 1;
  string label = 2;
  StepState state = 3;
  uint32 ranks = 4;
  // Iteration of a coupled or fan-out step (D49, D92).
  uint32 iteration = 5;
  // For a cached step: the Run that produced its outputs (D125).
  string cache_producer_run_id = 6;
  string cache_key = 7;
}

// A version a Run pinned (A§4.3).
message PinnedInput {
  EntityKind kind = 1;
  string id = 2;
  string name = 3;
  string version_hash = 4;
}

message PinnedPlugin {
  string plugin_id = 1;
  string version = 2;
  string so_hash = 3;
}

// Source identity of the build (D126).
message SourceIdentity {
  string engine_commit = 1;
  // Plugin ID to commit.
  map<string, string> plugin_commits = 2;
  string compiler = 3;
  bool dirty = 4;
}

// Values overriding design-variable fields, by field path (D109).
message ParameterOverride {
  map<string, double> values = 1;
}

// What a Run pinned at submission (A§4.3, D26).
message Provenance {
  repeated PinnedInput inputs = 1;
  ConceptRef concept = 2;
  string workflow_version_hash = 3;
  // Study Runs: the base workflow version the overrides apply to (D109).
  string base_workflow_version_hash = 4;
  ParameterOverride overrides = 5;
  repeated PinnedPlugin plugins = 6;
  string engine_build = 7;
  SourceIdentity source = 8;
  DeterminismMode mode = 9;
  // Content hashes of stored outputs and input datasets fed in (D22, D144).
  repeated string stored_inputs = 10;
}

// One execution of a pinned Workflow version (A§4.3, D22): an immutable
// spec plus an append-only execution record.
message Run {
  string id = 1;
  string project_id = 2;
  string name = 3;
  string workflow_id = 4;
  string workflow_version_hash = 5;
  RunState state = 6;
  google.protobuf.Timestamp submitted_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  repeated ProvenanceTag tags = 9;
  uint32 gpus = 10;
  DeterminismMode mode = 11;
  repeated Attempt attempts = 12;
  repeated StepStatus steps = 13;
  Provenance provenance = 14;
  string study_id = 15;
  ParameterOverride overrides = 16;
  // Every step came from the cache, so the Run completed at submission.
  bool cache_hit = 17;
  // The Run this one re-runs, if any (D101, D141).
  string rerun_of = 18;
  // 1-based place in the FIFO queue while queued; 0 otherwise (D102).
  uint32 queue_position = 19;
  // GPUs held while Running (D40).
  repeated uint32 gpu_indices = 20;
  ReproducibilityClass reproducibility = 21;
  google.protobuf.Timestamp started_at = 22;
}

message ListRunsResponse {
  // Newest first.
  repeated Run runs = 1;
}

// Body of POST /projects/{p}/runs (A§3.4, A§13.5).
message SubmitRunRequest {
  string workflow_id = 1;
  // 0 takes the default from the manifests' GPU hints (D102).
  uint32 gpus = 2;
  DeterminismMode mode = 3;
  // Validate and report what would be minted and cached, without submitting.
  bool dry_run = 4;
  string name = 5;
  // Set for "re-run with edited workflow" (D141).
  string rerun_of = 6;
}

// A draft the submission mints into a version (A§4.2, D56).
message DraftToMint {
  EntityKind kind = 1;
  string id = 2;
  string name = 3;
  uint32 revision = 4;
  string version_hash = 5;
  // The draft equals an existing version, which is reused.
  bool reuses_version = 6;
}

message SubmitRunResponse {
  // The submitted Run; unset for a dry run or when issues block it.
  Run run = 1;
  repeated DraftToMint minted = 2;
  repeated ValidationIssue issues = 3;
  // Every step is cached: the Run completes at submission (A§3.4).
  bool cache_hit = 4;
  // Node IDs whose outputs come from the cache.
  repeated string cached_steps = 5;
  uint32 default_gpus = 6;
  // Installed GPUs.
  uint32 max_gpus = 7;
  // GPU counts every step supports, within the installed GPUs (D116).
  repeated uint32 allowed_gpus = 8;
}

enum RunAction {
  RUN_ACTION_UNSPECIFIED = 0;
  RUN_ACTION_PAUSE = 1;
  RUN_ACTION_RESUME = 2;
  RUN_ACTION_CANCEL = 3;
  RUN_ACTION_DISCARD = 4;
}

// Body of POST /projects/{p}/runs/{r}/actions (A§14.1).
message RunActionRequest {
  RunAction action = 1;
}

enum RerunInputs {
  RERUN_INPUTS_UNSPECIFIED = 0;
  // The same pinned versions.
  RERUN_INPUTS_SAME = 1;
  // The head version of every pinned input (D101).
  RERUN_INPUTS_LATEST = 2;
}

// Body of POST /projects/{p}/runs/{r}/rerun. Unchanged steps come from the
// cache (D101).
message RerunRequest {
  RerunInputs inputs = 1;
  uint32 gpus = 2;
  DeterminismMode mode = 3;
}

// A convergence residual of a step iteration (A§3.5).
message Residual {
  string node_id = 1;
  uint32 iteration = 2;
  string name = 3;
  double value = 4;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}

// A structured log line (D44).
message LogLine {
  google.protobuf.Timestamp time = 1;
  LogLevel level = 2;
  int32 rank = 3;
  string node_id = 4;
  string message = 5;
  map<string, string> fields = 6;
}

message CheckpointCommitted {
  uint32 attempt = 1;
  uint32 epoch = 2;
}

// Event on /ws/runs/{r}. A run snapshot is a state change from the
// acknowledged log and overwrites what the client holds; the rest is
// progress and may be dropped (D106).
message RunEvent {
  string run_id = 1;
  google.protobuf.Timestamp time = 2;
  oneof event {
    Run run = 10;
    StepStatus step = 11;
    Residual residual = 12;
    LogLine log = 13;
    RunOutput output = 14;
    CheckpointCommitted checkpoint = 15;
  }
}
