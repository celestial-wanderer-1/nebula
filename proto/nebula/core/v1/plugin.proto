syntax = "proto3";

package nebula.core.v1;

import "nebula/core/v1/entity.proto";

enum PluginOrigin {
  PLUGIN_ORIGIN_UNSPECIFIED = 0;
  // First-party modules declared in the core manifest (D111).
  PLUGIN_ORIGIN_CORE = 1;
  PLUGIN_ORIGIN_PLUGIN = 2;
}

// ABI fingerprint carried by every manifest (D45, D131).
message AbiFingerprint {
  string compiler = 1;
  string stdlib = 2;
  string gpu_runtime = 3;
  string nebula_abi = 4;
}

enum ExtensionKind {
  EXTENSION_KIND_UNSPECIFIED = 0;
  EXTENSION_KIND_SOLVER = 1;
  EXTENSION_KIND_ADAPTER = 2;
  EXTENSION_KIND_POST_OP = 3;
  EXTENSION_KIND_GEOMETRY_COMPONENT = 4;
  EXTENSION_KIND_CONCEPT = 5;
  EXTENSION_KIND_OPTIMIZER = 6;
  EXTENSION_KIND_OBJECTIVE = 7;
}

// Type of a workflow port (A§13.4). Data ports are typed by sub-contract,
// for example "Equilibrium.Axisym2D"; connecting different sub-contracts needs
// an explicit adapter (D55). Entity ports are bound with a reference, not an
// edge (D107).
message PortType {
  oneof type {
    string sub_contract = 1;
    EntityKind entity = 2;
  }
  // A time series on a declared time base (D92).
  bool time_series = 3;
  // Name of the time base, shown on time-series edges.
  string time_base = 4;
}

message PortDecl {
  string name = 1;
  PortType type = 2;
  // A workflow is valid without this input bound.
  bool optional = 3;
  string description = 4;
}

// Default GPU count and the rank counts a step supports (D102, D116).
message GpuHint {
  uint32 default_gpus = 1;
  // Empty: any count. A step that does not scale lists only 1 (D116).
  repeated uint32 rank_counts = 2;
}

message Extension {
  string id = 1;
  ExtensionKind kind = 2;
  string display_name = 3;
  // Calculation type, for example "equilibrium"; groups the workflow palette.
  string calculation_type = 4;
  // Fully qualified name of the config message.
  string config_message = 5;
  repeated string sub_contracts = 6;
  repeated PortDecl inputs = 7;
  repeated PortDecl outputs = 8;
  // Capability traits the project concept and the geometry symmetry must
  // provide, for example "axisymmetric" or "closed_field_lines" (D64, D113).
  repeated string required_traits = 9;
  // Topological traits a Concept extension provides (D64).
  repeated string provided_traits = 10;
  GpuHint gpu = 11;
}

enum SmokeResult {
  SMOKE_RESULT_UNSPECIFIED = 0;
  SMOKE_RESULT_PASSED = 1;
  SMOKE_RESULT_FAILED = 2;
  SMOKE_RESULT_NOT_RUN = 3;
}

// Smoke V&V status per GPU model (D61, D140).
message SmokeStatus {
  string gpu_model = 1;
  SmokeResult result = 2;
  string detail = 3;
}

message PluginInfo {
  string id = 1;
  string version = 2;
  PluginOrigin origin = 3;
  AbiFingerprint abi = 4;
  string so_hash = 5;
  repeated Extension extensions = 6;
  // FileDescriptorSet of the plugin's own .proto files, excluding core files.
  // Empty for core, whose descriptors are compiled into every client (D54, D133).
  bytes descriptor_set = 7;
  repeated SmokeStatus smoke = 8;
}

message ListPluginsResponse {
  repeated PluginInfo plugins = 1;
}
